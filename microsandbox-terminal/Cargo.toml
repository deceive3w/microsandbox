[package]
name = "microsandbox-terminal"
description = "`microsandbox-terminal` provides interactive PTY/TTY terminal support for microsandbox."
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "microsandbox_terminal"
path = "lib/lib.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
libc.workspace = true
uuid.workspace = true
nix = { workspace = true, features = ["fs", "process", "signal", "term", "ioctl"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
